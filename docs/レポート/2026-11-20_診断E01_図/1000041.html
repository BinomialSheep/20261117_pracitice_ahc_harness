<script>
for (const input of document.querySelectorAll('[data-layer]')) {
  const layers = document.querySelectorAll('.' + input.dataset.layer);
  function update() {
    for (const layer of layers) layer.style.display = input.checked ? 'inline' : 'none';
  }
  input.addEventListener('change', update);
  update();
}
for (const input of document.querySelectorAll('[data-shot-slider]')) {
  const figure = input.closest('figure');
  const svg = figure.querySelector('svg');
  const marks = svg.querySelectorAll('[data-shot]');
  const output = figure.querySelector('output');
  input.addEventListener('input', () => {
    const index = input.value;
    svg.classList.toggle('has-shot', index !== '0');
    let title;
    for (const mark of marks) {
      const selected = mark.dataset.shot === index;
      mark.classList.toggle('selected-shot', selected);
      if (selected && !title) title = mark.querySelector('title').textContent;
    }
    output.textContent = title ?? '全発射';
  });
}
</script>
